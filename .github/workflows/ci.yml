name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      # One command, so pip can't replace the git otterwiki with an older
      # PyPI release while resolving chromadb's dependencies.
      - name: Install package and upstream otterwiki
        run: pip install -e ".[dev,chroma,faiss]" "otterwiki @ git+https://github.com/redimp/otterwiki.git@main"
      - name: Show otterwiki version
        run: python -c 'import importlib.metadata as m; print("otterwiki", m.version("otterwiki"))'
      - name: Run tests
        run: pytest tests/
